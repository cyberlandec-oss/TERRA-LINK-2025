# Servicios locales de desarrollo (TECH-001). Solo desarrollo: credenciales de ejemplo
# vienen de .env (copiar .env.example). No usar en staging/producción.
name: terra-link
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?definir en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir en .env}
      POSTGRES_DB: ${POSTGRES_DB:?definir en .env}
    ports: ["${POSTGRES_PORT:-5440}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  # S3 compatible local (VersityGW, backend posix). MinIO ya no publica imágenes en Docker Hub.
  object-storage:
    image: versity/versitygw:v1.8.0
    command: ["--port", ":9000", "posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY:?definir en .env}
      ROOT_SECRET_KEY: ${S3_SECRET_KEY:?definir en .env}
    ports: ["${S3_PORT:-9000}:9000"]
    volumes: [object-data:/data]
  # Aplicación en contenedores (opcional): `docker compose --profile app up -d --build --wait`.
  # Secretos desde .env en tiempo de ejecución; nunca se copian a las imágenes.
  migrate:
    profiles: [app]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: terra-link-api:local
    command: ["node", "dist/db/migrate-cli.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PII_KEYS: ${PII_KEYS:?definir en .env}
      PII_ACTIVE_KEY_ID: ${PII_ACTIVE_KEY_ID:?definir en .env}
      PII_INDEX_KEY: ${PII_INDEX_KEY:?definir en .env}
      S3_ENDPOINT: http://object-storage:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?definir en .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?definir en .env}
      S3_BUCKET: ${S3_BUCKET:-terra-link-private}
    depends_on:
      postgres: { condition: service_healthy }
  api:
    profiles: [app]
    image: terra-link-api:local
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?definir en .env}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      PII_KEYS: ${PII_KEYS:?definir en .env}
      PII_ACTIVE_KEY_ID: ${PII_ACTIVE_KEY_ID:?definir en .env}
      PII_INDEX_KEY: ${PII_INDEX_KEY:?definir en .env}
      S3_ENDPOINT: http://object-storage:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?definir en .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?definir en .env}
      S3_BUCKET: ${S3_BUCKET:-terra-link-private}
      WEB_ORIGIN: http://localhost:${WEB_HOST_PORT:-3000}
      API_PORT: 4000
    ports: ["${API_HOST_PORT:-4000}:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      object-storage: { condition: service_started }
  worker:
    profiles: [app]
    image: terra-link-api:local
    command: ["node", "dist/worker-main.js"]
    # La imagen de la API comprueba /health/live, que el worker no sirve; se reinicia si el proceso cae.
    healthcheck: { disable: true }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-1000}
      S3_ENDPOINT: http://object-storage:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?definir en .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?definir en .env}
      S3_BUCKET: ${S3_BUCKET:-terra-link-private}
      STORAGE_SWEEP_MS: ${STORAGE_SWEEP_MS:-600000}
    depends_on:
      migrate: { condition: service_completed_successfully }
    # Se puede escalar (`--scale worker=2`): el reclamo usa FOR UPDATE SKIP LOCKED.
  web:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_HOST_PORT:-4000}
    image: terra-link-web:local
    ports: ["${WEB_HOST_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres-data:
  object-data:
